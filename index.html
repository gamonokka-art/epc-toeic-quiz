<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPC TOKYO | TOEIC Grammar Quiz</title>
<style>
:root{font-family:system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#172b40;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#123653;color:white;padding:34px 18px;text-align:center}header h1{margin:5px 0 8px;font-size:clamp(24px,4vw,36px)}header p{margin:0;color:#d7e7f1}main{max-width:820px;margin:30px auto;padding:0 16px 36px}.intro{line-height:1.8}.question{background:white;border:1px solid #e0e8ee;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 3px 14px #142b400b}.question h2{font-size:15px;color:#37627f;margin:0 0 12px}.sentence{font-size:18px;line-height:1.7;font-weight:600}.choices{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.choices label{display:flex;align-items:center;gap:7px;border:1px solid #b7cbd9;border-radius:9px;padding:10px 15px;cursor:pointer;min-width:112px}.choices label:has(input:checked){background:#e6f1fa;border-color:#276d9c}.explanation{display:none;background:#f1f7fb;border-left:4px solid #357ca6;padding:12px 14px;margin-top:16px;line-height:1.75;border-radius:4px}.explanation.visible{display:block}.correct{color:#187348;font-weight:700}.incorrect{color:#b23434;font-weight:700}.actions{text-align:center;margin:24px 0}button{border:0;border-radius:10px;padding:13px 26px;font-size:16px;font-weight:700;cursor:pointer;margin:5px}#grade{background:#126397;color:white}#reset{background:#e1e9ef;color:#16364d}#result{display:none;text-align:center;background:white;border-radius:14px;padding:24px;margin-top:18px;border:2px solid #126397}#result strong{font-size:30px;color:#126397}footer{text-align:center;color:#5e7080;padding:25px 12px;font-size:13px}a{color:inherit}@media(max-width:480px){.question{padding:16px}.sentence{font-size:16px}.choices label{flex:1}}
</style>
</head>
<body>
<header><div>EPC TOKYO ONLINE ENGLISH SCHOOL</div><h1>TOEIC Grammar Quiz</h1><p>Subject–Verb Agreement | quality</p></header>
<main>
<p class="intro">英語の主語と動詞の一致を確認しましょう。各問題で正しい動詞を1つ選び、最後に「採点する」を押してください。全6問です。</p>
<div id="quiz"></div>
<div class="actions"><button type="button" id="grade">採点する・解説を見る</button><button type="button" id="reset">もう一度挑戦</button></div>
<div id="result" role="status" aria-live="polite"></div>
</main>
<footer>© EPC TOKYO · <a href="https://epctokyo.com" target="_blank" rel="noopener">epctokyo.com</a></footer>
<script>
const questions=[
{sentence:'The quality of this product (　　　) excellent.',options:['is','are'],answer:0,explanation:'主語の中心は単数名詞 quality です。of this product は quality を説明する部分なので、動詞は is になります。'},
{sentence:'These products (　　　) excellent quality.',options:['has','have'],answer:1,explanation:'主語は複数形の These products です。quality は目的語なので、動詞は have になります。'},
{sentence:'The quality of these products (　　　) improved recently.',options:['has','have'],answer:0,explanation:'主語の中心は単数名詞 quality です。of these products の products に引きずられず、現在完了形は has improved とします。'},
{sentence:'Some of the qualities of this product (　　　) particularly impressive.',options:['is','are'],answer:1,explanation:'Some of the qualities は複数の特性を指すため、動詞は are です。quality が qualities になると「特性・長所」という意味でも使われます。'},
{sentence:'One of the most important qualities of this product (　　　) its durability.',options:['is','are'],answer:0,explanation:'主語の中心は One（1つ）なので単数扱いです。後ろに qualities という複数形があっても is を使います。'},
{sentence:'The overall quality of the products manufactured at this factory (　　　) improved significantly.',options:['has','have'],answer:0,explanation:'主語の中心は単数名詞 quality です。of the products manufactured at this factory は修飾部分なので has improved が正解です。'}
];
const quiz=document.getElementById('quiz');
quiz.innerHTML=questions.map((q,i)=>`<section class="question"><h2>Question ${i+1}</h2><div class="sentence">${q.sentence}</div><div class="choices">${q.options.map((opt,j)=>`<label><input type="radio" name="q${i}" value="${j}"> (${String.fromCharCode(65+j)}) ${opt}</label>`).join('')}</div><div class="explanation" id="ex${i}"></div></section>`).join('');
document.getElementById('grade').addEventListener('click',()=>{
let score=0,unanswered=0;
questions.forEach((q,i)=>{const selected=document.querySelector(`input[name="q${i}"]:checked`);const correct=selected&&Number(selected.value)===q.answer;if(correct)score++;if(!selected)unanswered++;const ex=document.getElementById(`ex${i}`);ex.classList.add('visible');ex.innerHTML=`<span class="${correct?'correct':'incorrect'}">${correct?'✓ 正解':selected?'✗ 不正解':'— 未回答'}</span><br>正解：(${String.fromCharCode(65+q.answer)}) ${q.options[q.answer]}<br>${q.explanation}`;});
const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<strong>${score} / ${questions.length} 点</strong><p>${unanswered?`未回答：${unanswered}問。`:''}各問題の解説を確認してみましょう。</p>`;result.scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input[type="radio"]').forEach(el=>el.checked=false);document.querySelectorAll('.explanation').forEach(el=>{el.classList.remove('visible');el.textContent=''});document.getElementById('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'});});
</script>
</body>
</html>
